[project]
name = "audiotracks-worker"
version = "0.1.0"
description = "Narrate a PDF found via a natural-language prompt in Gmail or Google Drive."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mistralai>=3.0",
    "mistralai-workflows[mistralai]>=3.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
